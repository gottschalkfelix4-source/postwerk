name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, github-api-free
  workflow_dispatch:

# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check for known Go vulnerabilities
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Race-enabled tests
        working-directory: server
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and type-check/build
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: npm audit (non-blocking)
        working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=high
