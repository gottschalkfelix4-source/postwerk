name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, github-api-free
  workflow_dispatch:

# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check for known Go vulnerabilities
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Race-enabled tests
        working-directory: server
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and type-check/build
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: npm audit (non-blocking)
        working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=high
